<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание заявки</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="logo">
     AutoService CRM
</div>
<nav>
    <a href="/applications">Мои заявки</a>
    <a href="/create_application">Новая заявка</a>
    <a href="/reviews">Отзывы</a>
    <a href="/admin">Админ-панель</a>
    <a href="/">Выход</a>
</nav>

<h1>Создание заявки</h1>

<input id="car_model" placeholder="Модель автомобиля">
<br><br>

<input id="vin" placeholder="VIN">
<br><br>

<input id="service_type" placeholder="Вид услуги">
<br><br>

<textarea
id="description"
placeholder="Описание проблемы"
rows="5"
cols="50">
</textarea>

<br><br>

<input id="start_date" type="date">

<br><br>

<button onclick="createApplication()">
Создать заявку
</button>

<script>

async function createApplication(){

    const response = await fetch(
        "/api/applications",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                user_id: localStorage.getItem("user_id"),
                car_model: document.getElementById("car_model").value,
                vin: document.getElementById("vin").value,
                service_type: document.getElementById("service_type").value,
                description: document.getElementById("description").value,
                start_date: document.getElementById("start_date").value
            })
        }
    );

    const data = await response.json();

    alert(data.message || data.error);

}

</script>

</body>
</html>
