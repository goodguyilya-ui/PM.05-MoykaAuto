<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание заявки</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="logo">
     AutoService CRM
</div>

<nav>
    <a href="/applications">Мои заявки</a>
    <a href="/create_application">Новая заявка</a>
    <a href="/reviews">Отзывы</a>
    <a href="/admin">Админ-панель</a>
    <a href="/">Выход</a>
</nav>

<h1>Создание заявки</h1>

<input id="car_model" placeholder="Модель автомобиля">
<br><br>

<input id="vin" placeholder="VIN">
<br><br>

<input id="service_type" placeholder="Вид услуги">
<br><br>

<textarea
    id="description"
    placeholder="Описание проблемы"
    rows="5"
    cols="50">
</textarea>

<br><br>

<input id="start_date" type="date">

<br><br>

<button onclick="createApplication()">
    Создать заявку
</button>

<script>

async function createApplication(){

    const car_model =
        document.getElementById("car_model").value.trim();

    const vin =
        document.getElementById("vin").value.trim();

    const service_type =
        document.getElementById("service_type").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const start_date =
        document.getElementById("start_date").value;

    if(
        !car_model ||
        !vin ||
        !service_type ||
        !start_date
    ){
        alert("Заполните все обязательные поля");
        return;
    }

    const response = await fetch(
        "/api/applications",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id: localStorage.getItem("user_id"),
                car_model,
                vin,
                service_type,
                description,
                start_date
            })
        }
    );

    const data = await response.json();

    if(data.error){

        alert(data.error);
        return;
    }

    alert(data.message);

    document.getElementById("car_model").value = "";
    document.getElementById("vin").value = "";
    document.getElementById("service_type").value = "";
    document.getElementById("description").value = "";
    document.getElementById("start_date").value = "";

}

</script>

</body>
</html>
